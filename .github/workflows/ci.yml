name: CI

# Runs the gates that do not need the competition dataset. The workbook is
# licensed material and is not in the repository, so anything marked
# requires_data skips here and is covered locally instead.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor pyproject declares, the version in between, and the one
        # the image ships on. Testing only the last left the floor unverified.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check src tests evaluation scripts
          ruff format --check src tests evaluation scripts

      - name: Types
        run: mypy src/cardiac_agent --ignore-missing-imports

      - name: Tests
        run: pytest -q

      - name: House style
        run: python scripts/check_prose.py

      - name: Slide geometry
        run: python scripts/check_deck.py
