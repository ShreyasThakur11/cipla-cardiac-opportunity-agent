# Brings up the API and the Streamlit console from one image.
#
# Run from the repository root, where `make up` is the short form:
#   docker compose -f deploy/docker-compose.yml run --rm api cardiac-agent build
#   docker compose -f deploy/docker-compose.yml up
#
# The build context is the repository root, not this folder, so the Dockerfile
# copies the same paths it always did. Bind mounts are relative to this file.
#
# data/ is bind-mounted so the warehouse survives a restart and the licensed
# dataset never enters an image layer.

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cardiac-opportunity-agent:latest
    container_name: cardiac-api
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../exports:/app/exports
      - ../config:/app/config:ro
    environment:
      CARDIAC_API_HOST: 0.0.0.0
      CARDIAC_API_PORT: "8000"
      CARDIAC_LOG_LEVEL: ${CARDIAC_LOG_LEVEL:-INFO}
      CARDIAC_CORS_ORIGINS: http://localhost:8501
      # Defaults to deterministic mode. To enable the narrative layer, export
      # these in the shell or pass --env-file pointing at the root .env.
      CARDIAC_LLM_PROVIDER: ${CARDIAC_LLM_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CARDIAC_API_KEY: ${CARDIAC_API_KEY:-}
    restart: unless-stopped

  console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cardiac-opportunity-agent:latest
    container_name: cardiac-console
    depends_on:
      - api
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
      - ../exports:/app/exports
      - ../config:/app/config:ro
    environment:
      CARDIAC_LOG_LEVEL: ${CARDIAC_LOG_LEVEL:-INFO}
      CARDIAC_LLM_PROVIDER: ${CARDIAC_LLM_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command:
      - streamlit
      - run
      - src/cardiac_agent/ui/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    restart: unless-stopped
